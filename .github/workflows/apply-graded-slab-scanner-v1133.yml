name: Apply graded slab scanner v11.33

on:
  push:
    paths:
      - '.github/workflows/apply-graded-slab-scanner-v1133.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply graded slab scanner patch
        run: python scripts/apply_graded_slab_scanner_v1133.py
      - name: Verify
        run: |
          grep -q 'v11.33' index.html
          grep -q 'Scan slab label' index.html
          grep -q 'gradedCert' index.html
          grep -q 'scanGradedSlab' index.html
          grep -q 'Look up on ALT + eBay + Collectr' index.html
          ! grep -q 'gradedSourceTcg' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Add graded slab camera scanner v11.33"
            git push
          fi
