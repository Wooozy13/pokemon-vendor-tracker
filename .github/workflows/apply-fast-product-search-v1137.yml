name: Apply fast product search v11.37

on:
  push:
    paths:
      - '.github/workflows/apply-fast-product-search-v1137.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fast product search patch
        run: python scripts/apply_fast_product_search_v1137.py
      - name: Verify
        run: |
          grep -q 'v11.37' index.html
          grep -q 'Fast product search v11.37' index.html
          grep -q 'fastCardQueryCache' index.html
          grep -q 'fastSealedSearchCache' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Speed up product lookup v11.37"
            git push
          fi
