name: Native Supabase auth v12.0.6
on:
  push:
    paths:
      - scripts/fix_native_supabase_auth_v1206.py
      - .github/workflows/fix-native-supabase-auth-v1206.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_native_supabase_auth_v1206.py
      - name: Validate
        run: |
          grep -q 'v12.0.6' index.html
          grep -q 'INITIAL_SESSION' index.html
          ! grep -q 'VT_AUTH_BACKUP_KEY' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Use native Supabase persisted session flow v12.0.6'
          git push
