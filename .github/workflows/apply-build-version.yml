name: Apply VendorTracker build version

on:
  push:
    paths:
      - '.github/workflows/apply-build-version.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visible build number
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          version='v11.22'
          if 'const APP_VERSION=' not in s:
              s=s.replace('const LOCAL_PREFIX="vendortracker_data_v3_";', f'const LOCAL_PREFIX="vendortracker_data_v3_";\nconst APP_VERSION="{version}";', 1)
          else:
              import re
              s=re.sub(r'const APP_VERSION="[^"]+";', f'const APP_VERSION="{version}";', s, count=1)
          anchor='''          <div class="detailsBox">\n            <strong>TCGplayer price lookup</strong>'''
          build='''          <div class="detailsBox" id="buildInfoBox">\n            <strong>VendorTracker build</strong>\n            <p class="small" style="margin:6px 0 0"><span id="appVersionLabel">v11.22</span> · Updated Aug 15, 2026</p>\n            <p class="small" style="margin:4px 0 0">If this version appears after a refresh, the newest site update has deployed.</p>\n          </div>\n'''
          if 'id="buildInfoBox"' not in s:
              s=s.replace(anchor, build+anchor, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Show VendorTracker v11.22 build number"
            git push
          fi
