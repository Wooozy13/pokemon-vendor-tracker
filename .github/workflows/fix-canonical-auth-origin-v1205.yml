name: Canonical auth origin v12.0.5
on:
  push:
    paths:
      - scripts/fix_canonical_auth_origin_v1205.py
      - .github/workflows/fix-canonical-auth-origin-v1205.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_canonical_auth_origin_v1205.py
      - name: Validate
        run: |
          grep -q 'v12.0.5' index.html
          grep -q 'Canonical origin guard v12.0.5' index.html
          grep -q 'location.hostname==="vendortracker.app"' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          assert s.count('<script')==s.count('</script>')
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep Supabase auth on canonical www origin v12.0.5'
          git push
