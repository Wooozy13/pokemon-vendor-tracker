name: Hard refresh auth fix v12.0.4
on:
  push:
    paths:
      - scripts/fix_hard_refresh_auth_v1204.py
      - .github/workflows/fix-hard-refresh-auth-v1204.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_hard_refresh_auth_v1204.py
      - name: Validate
        run: |
          grep -q 'v12.0.4' index.html
          grep -q 'VT_AUTH_BACKUP_KEY' index.html
          grep -q 'sb.auth.setSession' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix hard refresh auth persistence v12.0.4'
          git push
