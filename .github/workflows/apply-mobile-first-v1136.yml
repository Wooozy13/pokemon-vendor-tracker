name: Apply mobile-first UI v11.36

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-first-v1136.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-first patch
        run: python scripts/apply_mobile_first_v1136.py
      - name: Verify
        run: |
          grep -q 'v11.36' index.html
          grep -q 'Mobile-first usability v11.36' index.html
          grep -q 'slabFastActions' index.html
          grep -q '<span>Buy</span>' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Make VendorTracker mobile-first v11.36"
            git push
          fi
