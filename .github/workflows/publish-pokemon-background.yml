name: VendorTracker Pokémon background
on:
  push:
    paths:
      - scripts/apply_pokemon_background_v12121.py
      - .github/workflows/publish-pokemon-background.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_pokemon_background_v12121.py
      - name: Validate background patch
        run: |
          grep -q 'VendorTracker v12.12.1 — Pokémon character background' index.html
          grep -q 'const APP_VERSION="v12.12.1";' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          assert s.count('<style>')==s.count('</style>')
          assert s.count('<script')==s.count('</script>')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Add Pokémon character background v12.12.1'
          git push
