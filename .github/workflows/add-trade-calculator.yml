name: Add Vendor Mode trade calculator

on:
  push:
    paths:
      - '.github/workflows/add-trade-calculator.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add trade calculator and offer checker
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''
          /* Vendor trade calculator */
          .tradeModal .modal{width:min(1050px,100%)}
          .tradeGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
          .tradeSide{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f8fafc}
          .tradeSide h3{margin:0 0 10px}
          .tradeRow{display:grid;grid-template-columns:minmax(0,1fr) 85px 95px auto;gap:7px;align-items:center;margin-top:7px}
          .tradeTotals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
          .tradeMetric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
          .tradeMetric span{display:block;font-size:11px;color:var(--muted);font-weight:750}.tradeMetric strong{display:block;font-size:20px;margin-top:4px}
          .offerResult{margin-top:12px;padding:14px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe}
          .offerPct{font-size:28px;font-weight:900;letter-spacing:-.03em}
          .tradePositive{color:#166534}.tradeNegative{color:#991b1b}.tradeNeutral{color:#475569}
          @media(max-width:820px){.tradeGrid{grid-template-columns:1fr}.tradeTotals{grid-template-columns:1fr}.tradeRow{grid-template-columns:1fr 72px 88px auto}.tradeModal .modal{max-height:96vh}}
          '''
          if '/* Vendor trade calculator */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          # Add Trade Calculator button to Vendor Mode bar.
          needle='<button class="btn btnGhost vendorExit" onclick="exitVendorMode()">Exit Vendor Mode</button>'
          if 'openTradeCalculator()' not in s:
              s=s.replace(needle, '<button class="btn btnSoft vendorExit" onclick="openTradeCalculator()">⇄ Trade calculator</button>'+needle,1)

          # Modal before undo bar.
          modal='''
          <div id="tradeCalculatorModal" class="modalBack hidden tradeModal">
            <div class="modal">
              <div class="modalHead">
                <div><h2>Trade Calculator</h2><div class="small">Compare trades and customer offers using your actual VendorTracker inventory.</div></div>
                <button class="btn btnGhost" onclick="closeTradeCalculator()">Close</button>
              </div>
              <div class="modalBody">
                <div class="tradeGrid">
                  <div class="tradeSide">
                    <h3>Your side</h3>
                    <div class="small">Add items from your inventory. Your stored sell price is used by default.</div>
                    <div class="grid" style="margin-top:10px;grid-template-columns:minmax(0,1fr) 90px auto">
                      <select id="tradeYourProduct" class="input"></select>
                      <input id="tradeYourQty" class="input" type="number" min="1" value="1" placeholder="Qty">
                      <button class="btn btnPrimary" onclick="addYourTradeItem()">Add</button>
                    </div>
                    <div id="tradeYourItems" style="margin-top:8px"></div>
                  </div>
                  <div class="tradeSide">
                    <h3>Their side</h3>
                    <div class="small">Enter what they're giving you and the value you're assigning to it.</div>
                    <div class="grid" style="margin-top:10px;grid-template-columns:minmax(0,1fr) 110px 80px auto">
                      <input id="tradeTheirName" class="input" placeholder="Card / item">
                      <input id="tradeTheirValue" class="input" type="number" min="0" step=".01" placeholder="Value">
                      <input id="tradeTheirQty" class="input" type="number" min="1" value="1" placeholder="Qty">
                      <button class="btn btnPrimary" onclick="addTheirTradeItem()">Add</button>
                    </div>
                    <div id="tradeTheirItems" style="margin-top:8px"></div>
                  </div>
                </div>

                <div class="tradeTotals">
                  <div class="tradeMetric"><span>Your side</span><strong id="tradeYourTotal">$0.00</strong></div>
                  <div class="tradeMetric"><span>Their side</span><strong id="tradeTheirTotal">$0.00</strong></div>
                  <div class="tradeMetric"><span>Difference</span><strong id="tradeDifference">Even</strong><div id="tradeDifferenceNote" class="small"></div></div>
                </div>

                <div class="panel" style="margin-top:16px">
                  <div class="panelHead"><div><h3>Offer checker</h3><div class="small">See exactly what percentage a customer's cash offer is of your asking price.</div></div></div>
                  <div class="grid" style="grid-template-columns:minmax(0,1fr) 150px auto">
                    <select id="offerProduct" class="input" onchange="renderOfferChecker()"></select>
                    <input id="offerAmount" class="input" type="number" min="0" step=".01" placeholder="Their offer" oninput="renderOfferChecker()">
                    <button class="btn btnGhost" onclick="clearOfferChecker()">Clear</button>
                  </div>
                  <div id="offerResult" class="offerResult">
                    <div class="small">Choose an inventory item and enter their offer.</div>
                  </div>
                </div>

                <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn btnGhost" onclick="clearTradeCalculator()">Clear trade</button></div>
              </div>
            </div>
          </div>
          '''
          if 'id="tradeCalculatorModal"' not in s:
              s=s.replace('<div id="undoBar"',modal+'\n<div id="undoBar"',1)

          # State variables.
          state='''
          let tradeYourItems=[];
          let tradeTheirItems=[];
          '''
          if 'let tradeYourItems=[];' not in s:
              anchor='let pendingSealedData=null;'
              s=s.replace(anchor,anchor+'\n'+state,1)

          # Functions before renderDashboard.
          funcs=r'''
          function openTradeCalculator(){
            populateTradeSelectors();
            renderTradeCalculator();
            document.getElementById("tradeCalculatorModal").classList.remove("hidden");
          }
          function closeTradeCalculator(){document.getElementById("tradeCalculatorModal").classList.add("hidden")}
          function populateTradeSelectors(){
            const opts='<option value="">Choose inventory item…</option>'+db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.qty} in stock)</option>`).join("");
            const a=document.getElementById("tradeYourProduct"),b=document.getElementById("offerProduct");
            if(a)a.innerHTML=opts;if(b)b.innerHTML=opts;
          }
          function addYourTradeItem(){
            const id=document.getElementById("tradeYourProduct")?.value;
            const qty=Math.max(1,Number(document.getElementById("tradeYourQty")?.value||1));
            const p=db.products.find(x=>x.id===id);if(!p)return toast("Choose an inventory item");
            if(qty>p.qty)return toast("Not enough inventory");
            const existing=tradeYourItems.find(x=>x.productId===id);
            if(existing)existing.qty=Math.min(p.qty,existing.qty+qty);
            else tradeYourItems.push({productId:p.id,name:p.name,qty,price:Number(p.price||0),market:p.tcgMarket!=null?Number(p.tcgMarket):null,photo:p.photo||""});
            renderTradeCalculator();
          }
          function addTheirTradeItem(){
            const name=document.getElementById("tradeTheirName")?.value.trim()||"Their item";
            const value=Math.max(0,Number(document.getElementById("tradeTheirValue")?.value||0));
            const qty=Math.max(1,Number(document.getElementById("tradeTheirQty")?.value||1));
            if(!value)return toast("Enter their item's value");
            tradeTheirItems.push({id:uid(),name,value,qty});
            document.getElementById("tradeTheirName").value="";document.getElementById("tradeTheirValue").value="";document.getElementById("tradeTheirQty").value=1;
            renderTradeCalculator();
          }
          function removeYourTradeItem(id){tradeYourItems=tradeYourItems.filter(x=>x.productId!==id);renderTradeCalculator()}
          function removeTheirTradeItem(id){tradeTheirItems=tradeTheirItems.filter(x=>x.id!==id);renderTradeCalculator()}
          function changeYourTradeValue(id,v){const x=tradeYourItems.find(x=>x.productId===id);if(x)x.price=Math.max(0,Number(v||0));renderTradeCalculator()}
          function changeTheirTradeValue(id,v){const x=tradeTheirItems.find(x=>x.id===id);if(x)x.value=Math.max(0,Number(v||0));renderTradeCalculator()}
          function tradeYourTotal(){return tradeYourItems.reduce((a,x)=>a+x.price*x.qty,0)}
          function tradeTheirTotal(){return tradeTheirItems.reduce((a,x)=>a+x.value*x.qty,0)}
          function renderTradeCalculator(){
            const y=document.getElementById("tradeYourItems"),t=document.getElementById("tradeTheirItems");if(!y||!t)return;
            y.innerHTML=tradeYourItems.length?tradeYourItems.map(x=>`<div class="tradeRow">
              <div><strong>${esc(x.name)}</strong><div class="small">Qty ${x.qty}${x.market!=null?` • Market ${money(x.market)}`:""}</div></div>
              <input class="input" type="number" min="0" step=".01" value="${Number(x.price).toFixed(2)}" title="Value each" onchange="changeYourTradeValue('${x.productId}',this.value)">
              <strong>${money(x.price*x.qty)}</strong>
              <button class="miniBtn btnDanger" onclick="removeYourTradeItem('${x.productId}')">×</button>
            </div>`).join(""):'<div class="small" style="padding:10px 0">No items added.</div>';
            t.innerHTML=tradeTheirItems.length?tradeTheirItems.map(x=>`<div class="tradeRow">
              <div><strong>${esc(x.name)}</strong><div class="small">Qty ${x.qty}</div></div>
              <input class="input" type="number" min="0" step=".01" value="${Number(x.value).toFixed(2)}" title="Value each" onchange="changeTheirTradeValue('${x.id}',this.value)">
              <strong>${money(x.value*x.qty)}</strong>
              <button class="miniBtn btnDanger" onclick="removeTheirTradeItem('${x.id}')">×</button>
            </div>`).join(""):'<div class="small" style="padding:10px 0">No items added.</div>';
            const yt=tradeYourTotal(),tt=tradeTheirTotal(),diff=tt-yt;
            document.getElementById("tradeYourTotal").textContent=money(yt);
            document.getElementById("tradeTheirTotal").textContent=money(tt);
            const de=document.getElementById("tradeDifference"),dn=document.getElementById("tradeDifferenceNote");
            if(Math.abs(diff)<.005){de.textContent="Even";de.className="tradeNeutral";dn.textContent="Both sides are equal."}
            else if(diff>0){de.textContent="+"+money(diff);de.className="tradePositive";dn.textContent=`Their side is ${money(diff)} higher.`}
            else{de.textContent="-"+money(Math.abs(diff));de.className="tradeNegative";dn.textContent=`Your side is ${money(Math.abs(diff))} higher — they'd need to add that much value/cash.`}
          }
          function renderOfferChecker(){
            const id=document.getElementById("offerProduct")?.value,offer=Math.max(0,Number(document.getElementById("offerAmount")?.value||0));
            const p=db.products.find(x=>x.id===id),box=document.getElementById("offerResult");if(!box)return;
            if(!p){box.innerHTML='<div class="small">Choose an inventory item and enter their offer.</div>';return}
            const ask=Number(p.price||0),market=p.tcgMarket!=null?Number(p.tcgMarket):null;
            if(!offer){box.innerHTML=`<strong>${esc(p.name)}</strong><div class="small" style="margin-top:5px">Your price: <strong>${money(ask)}</strong>${market!=null?` • TCGplayer market: <strong>${money(market)}</strong>`:""}</div><div class="small" style="margin-top:8px">Enter their offer to calculate the percentage.</div>`;return}
            const pct=ask>0?(offer/ask)*100:0,below=ask-offer,discount=ask>0?(1-offer/ask)*100:0;
            const cls=pct>=100?"tradePositive":pct>=80?"tradeNeutral":"tradeNegative";
            box.innerHTML=`<strong>${esc(p.name)}</strong>
              <div class="small" style="margin-top:5px">Your asking price: <strong>${money(ask)}</strong>${market!=null?` • TCGplayer market: <strong>${money(market)}</strong>`:""}</div>
              <div class="offerPct ${cls}" style="margin-top:8px">${pct.toFixed(1)}% of asking</div>
              <div style="margin-top:5px">Their offer: <strong>${money(offer)}</strong></div>
              <div class="small" style="margin-top:4px">${below>0?`${money(below)} below asking (${Math.max(0,discount).toFixed(1)}% off)`:below<0?`${money(Math.abs(below))} above asking`:'Exactly your asking price'}</div>`;
          }
          function clearOfferChecker(){const a=document.getElementById("offerProduct"),b=document.getElementById("offerAmount");if(a)a.value="";if(b)b.value="";renderOfferChecker()}
          function clearTradeCalculator(){tradeYourItems=[];tradeTheirItems=[];renderTradeCalculator();clearOfferChecker()}
          '''
          if 'function openTradeCalculator()' not in s:
              s=s.replace('function renderDashboard(){',funcs+'\nfunction renderDashboard(){',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Add Vendor Mode trade calculator and offer checker"
            git push
          fi
