name: Apply fast slab scan v11.35

on:
  push:
    paths:
      - '.github/workflows/apply-fast-slab-scan-v1135.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fast slab scan patch
        run: python scripts/apply_fast_slab_scan_v1135.py
      - name: Verify
        run: |
          grep -q 'v11.35' index.html
          grep -q 'Scan slab label' index.html
          grep -q 'ebaySlabQuick' index.html
          grep -q 'scanEbaySlabPhoto' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Add fast slab scan lookup v11.35"
            git push
          fi
