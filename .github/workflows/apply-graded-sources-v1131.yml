name: Apply graded sources v11.31

on:
  push:
    paths:
      - 'scripts/apply_graded_sources_v1131.py'
      - '.github/workflows/apply-graded-sources-v1131.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply graded source patch
        run: python scripts/apply_graded_sources_v1131.py
      - name: Verify
        run: |
          grep -q 'v11.31' index.html
          grep -q 'gradedSourceAlt' index.html
          grep -q 'gradedSourceTcg' index.html
          grep -q 'gradedSourceCollectr' index.html
          grep -q 'Automatic .* pricing — Coming Soon' index.html || true
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Add ALT TCGplayer Collectr graded pricing sources v11.31"
            git push
          fi
