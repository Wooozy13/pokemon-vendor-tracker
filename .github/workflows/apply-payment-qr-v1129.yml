name: Apply payment QR v11.29

on:
  push:
    paths:
      - '.github/workflows/apply-payment-qr-v1129.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply payment QR patch
        run: python scripts/apply_payment_qr_v1129.py
      - name: Verify
        run: |
          grep -q 'v11.29' index.html
          grep -q 'id="pay_cashapp_handle"' index.html
          grep -q 'id="customerPaymentModal"' index.html
          grep -q 'function requestCheckout(payment)' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Add personal payment QR checkout v11.29"
            git push
          fi
