name: Apply graded search links v11.32

on:
  push:
    paths:
      - '.github/workflows/apply-graded-search-links-v1132.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply graded search patch
        run: python scripts/apply_graded_search_links_v1132.py
      - name: Verify
        run: |
          grep -q 'v11.32' index.html
          grep -q 'TCGPlayer' index.html
          grep -q 'https://app.getcollectr.com/?query=' index.html
          grep -q "gradedSearchText" index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Update graded search links v11.32"
            git push
          fi
