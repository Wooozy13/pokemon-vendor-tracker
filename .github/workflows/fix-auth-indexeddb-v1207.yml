name: Auth persistence v12.0.7
on:
  push:
    paths:
      - scripts/fix_auth_indexeddb_v1207.py
      - .github/workflows/fix-auth-indexeddb-v1207.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_auth_indexeddb_v1207.py
      - name: Validate
        run: |
          grep -q 'v12.0.7' index.html
          grep -q 'vendortracker_auth_v1' index.html
          grep -q 'storage:vtAuthStorage' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Persist auth with IndexedDB fallback v12.0.7'
          git push
