name: Apply graded price check v11.30
on:
  push:
    paths:
      - '.github/workflows/apply-graded-price-check-v1130.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply graded price check patch
        run: python scripts/apply_graded_price_check_v1130.py
      - name: Verify
        run: |
          grep -q 'v11.30' index.html
          grep -q 'id="graded" class="page"' index.html
          grep -q 'Automatic eBay comps coming soon' index.html
          grep -q 'function updateGradedCompAverage()' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Add Graded Price Check v11.30"
            git push
          fi
