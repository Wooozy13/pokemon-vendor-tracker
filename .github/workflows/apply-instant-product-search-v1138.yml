name: Apply instant product search v11.38

on:
  push:
    paths:
      - '.github/workflows/apply-instant-product-search-v1138.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply instant product search patch
        run: python scripts/apply_instant_product_search_v1138.py
      - name: Verify
        run: |
          grep -q 'v11.38' index.html
          grep -q 'Instant staged product search v11.38' index.html
          grep -q 'firstNonEmpty' index.html
          grep -q 'PRODUCT_CACHE_PREFIX' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Make product search feel instant v11.38"
            git push
          fi
