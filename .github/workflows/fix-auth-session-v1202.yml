name: Auth session fix v12.0.2
on:
  push:
    paths:
      - scripts/fix_auth_session_v1202.py
      - .github/workflows/fix-auth-session-v1202.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_auth_session_v1202.py
      - name: Validate auth patch
        run: |
          grep -q 'v12.0.2' index.html
          grep -q 'persistSession:true' index.html
          grep -q 'autoRefreshToken:true' index.html
          grep -q 'session:check' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Harden auth session persistence v12.0.2'
          git push
