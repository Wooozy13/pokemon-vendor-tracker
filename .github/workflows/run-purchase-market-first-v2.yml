name: Run purchase market-first v11.24

on:
  push:
    paths:
      - 'scripts/apply_purchase_market_first.py'
      - '.github/workflows/run-purchase-market-first-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_purchase_market_first.py
      - name: Verify
        run: |
          grep -q 'id="purchaseBatchMarketTotal"' index.html
          grep -q 'function setPurchasePaid(id,v)' index.html
          grep -q 'id="savePurchaseBatchBtn"' index.html
          grep -q 'v11.24' index.html
          ! grep -q 'id="buyLineTotal"' index.html
          ! grep -q 'id="buyNewLineTotal"' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make purchase batches market-first v11.24"
          git push
