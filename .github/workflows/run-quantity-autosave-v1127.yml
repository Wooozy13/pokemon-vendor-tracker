name: Run quantity auto-save v11.27

on:
  push:
    paths:
      - '.github/workflows/run-quantity-autosave-v1127.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply_quantity_autosave_v1127.py
      - name: Verify
        run: |
          grep -F 'onchange="setInventoryQty' index.html
          grep -F 'onchange="editSale' index.html
          grep -F 'v11.27' index.html
      - name: Commit site
        run: |
          git config user.name "VendorTracker Updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No update needed"
          else
            git add index.html
            git commit -m "Auto-save quantity changes v11.27"
            git push
          fi
