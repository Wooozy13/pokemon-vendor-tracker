name: Mobile fixes v12.0.1
on:
  push:
    paths:
      - scripts/fix_mobile_nav_clear_search_v1201.py
      - .github/workflows/fix-mobile-nav-clear-search-v1201.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_mobile_nav_clear_search_v1201.py
      - name: Validate
        run: |
          grep -q 'v12.0.1' index.html
          grep -q 'vtToggleMobileMenu' index.html
          grep -q 'vtSearchPokemonCards1201' index.html
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          assert s.count('<style>')==s.count('</style>')
          assert s.count('<script')==s.count('</script>')
          pathlib.Path('/tmp/vt.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/vt.js
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix mobile nav and clear product search inputs v12.0.1'
          git push
